<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="gifpaint — paint and collage with images and animated gifs from the internet" />
    <title>gifpaint</title>
  </head>
  <body>
    <header id="topbar">
      <div id="topbar-tools">
      <span id="logo">gifpaint</span>
      <div class="group" id="tools">
        <button data-tool="paint" class="active" title="paint (B)">paint</button>
        <button data-tool="select" title="select/move (V)">select</button>
        <button data-tool="stamp" title="stamp image (S)">stamp</button>
      </div>
      <div class="group" id="brushes"></div>
      <div class="group">
        <input type="color" id="color" value="#ff7a4a" title="paint color" />
        <input type="color" id="bg" value="#111213" title="canvas color" />
        <label>size <input type="range" id="size" min="4" max="120" value="28" /></label>
      </div>
      <div class="group">
        <button id="undo" title="⌘Z">undo</button>
        <button id="redo" title="⇧⌘Z">redo</button>
        <button id="clear">clear</button>
      </div>
      <div class="group">
        <button id="save-png">png</button>
        <button id="save-gif">gif</button>
        <button id="save-webm">video</button>
        <label>secs <input type="number" id="duration" min="1" max="10" value="2" /></label>
      </div>
      <div class="group">
        <button id="save-project">save</button>
        <button id="load-project">load</button>
        <input type="file" id="project-file" accept=".json" hidden />
      </div>
      </div>
      <span id="status" role="status"></span>
      <div id="cloud">
        <button type="button" id="cloud-browse" title="your projects and the public gallery">browse</button>
        <button type="button" id="cloud-share" title="choose who can open it and copy the link">share</button>
        <button type="button" id="cloud-save" title="save to your account">cloud save</button>
        <button type="button" id="account" aria-haspopup="menu">sign in</button>
      </div>
    </header>

    <aside id="library">
      <div id="lib-tabs">
        <button data-tab="gifs" class="active">gifs</button>
        <button data-tab="images">images</button>
        <button data-tab="uploads">uploads</button>
      </div>
      <form id="lib-search-form">
        <input type="search" id="lib-search" placeholder="search giphy…" />
      </form>
      <div id="lib-grid"></div>
      <button id="lib-more">more</button>
      <input type="file" id="upload-file" accept="image/*,video/*" multiple hidden />
    </aside>

    <main id="stage">
      <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
      <div id="props" hidden>
        <label>scale <input type="range" id="p-scale" min="0.05" max="8" step="0.01" /></label>
        <label>rotate <input type="range" id="p-rot" min="-180" max="180" step="1" /></label>
        <label>opacity <input type="range" id="p-op" min="0.05" max="1" step="0.01" /></label>
        <button id="p-delete">delete</button>
      </div>
      <div id="drip-params" hidden>
        <div id="drip-tools" class="group">
          <button data-tool="stick" class="active" title="stick / hardened brush">stick</button>
          <button data-tool="brush" title="loaded brush — flick for a spatter cloud">brush</button>
          <button data-tool="baster" title="basting syringe — pressurized jet">baster</button>
          <button data-tool="can" title="paint can — wide pour">can</button>
        </div>
        <label>viscosity <input type="range" id="d-mu" min="0" max="1000" step="1" /><output></output></label>
        <label>height <input type="range" id="d-h" min="2" max="100" step="1" /><output></output></label>
        <label>stream <input type="range" id="d-a" min="8" max="200" step="1" /><output></output></label>
        <label>fall speed <input type="range" id="d-g" min="0.1" max="3" step="0.1" /><output></output></label>
        <label>pour speed <input type="range" id="d-v0" min="0.05" max="4" step="0.05" /><output></output></label>
        <label>wetting <input type="range" id="d-th" min="5" max="90" step="1" /><output></output></label>
        <span class="readout">lands at <output id="drip-v"></output></span>
      </div>
      <div id="hint">pick a gif from the library, then paint to reveal it · drop images or videos anywhere to upload</div>
    </main>

    <aside id="layers">
      <div class="panel-title">layers</div>
      <div id="layer-list"></div>
    </aside>

    <!-- Sheets (native <dialog>): one chrome for all. Title + X, no title divider,
         hairline footer with Cancel left of the commit. Bottom sheet on phones. -->
    <dialog id="auth-dialog" class="sheet" aria-labelledby="auth-title">
      <form class="sheet-inner" id="auth-form" novalidate>
        <header class="sheet-head">
          <h2 id="auth-title">join gifpaint</h2>
          <button type="button" class="sheet-x" data-close aria-label="close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </header>
        <div class="sheet-body">
          <button type="button" class="sheet-btn" data-provider="google">
            <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
            continue with Google
          </button>
          <button type="button" class="sheet-btn" data-provider="github">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.22 1.87.87 2.33.66.07-.52.28-.87.5-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            continue with GitHub
          </button>
          <div class="sheet-or" aria-hidden="true">or</div>
          <label class="field" id="auth-name-field">name <input type="text" id="auth-name" autocomplete="name" /></label>
          <label class="field">email <input type="email" id="auth-email" autocomplete="email" required /></label>
          <label class="field">password <input type="password" id="auth-password" autocomplete="new-password" minlength="8" required /></label>
          <p id="auth-error" class="sheet-error" role="alert" hidden></p>
          <button type="submit" id="auth-submit" class="sheet-btn active">continue</button>
        </div>
        <footer class="sheet-foot sheet-foot--center">
          <span id="auth-switch-hint">have an account?</span>
          <button type="button" id="auth-mode" class="sheet-link">sign in</button>
        </footer>
      </form>
    </dialog>

    <dialog id="save-dialog" class="sheet" aria-labelledby="save-title">
      <form class="sheet-inner" method="dialog">
        <header class="sheet-head">
          <h2 id="save-title">cloud save</h2>
          <button type="button" class="sheet-x" data-close aria-label="close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </header>
        <div class="sheet-body">
          <label class="field">name <input type="text" id="save-name" maxlength="120" autocomplete="off" /></label>
        </div>
        <footer class="sheet-foot">
          <button type="button" class="sheet-btn" data-close>cancel</button>
          <button type="submit" class="sheet-btn active" value="ok">save</button>
        </footer>
      </form>
    </dialog>

    <dialog id="share-dialog" class="sheet" aria-labelledby="share-title">
      <div class="sheet-inner">
        <header class="sheet-head">
          <h2 id="share-title">share</h2>
          <button type="button" class="sheet-x" data-close aria-label="close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </header>
        <div class="sheet-body">
          <fieldset class="access" id="share-access">
            <legend>who can open it</legend>
            <label class="access-row">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span>only you</span><input type="radio" name="visibility" value="private" />
            </label>
            <label class="access-row">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 9.2a2.8 2.8 0 0 0 4 0l2-2a2.8 2.8 0 0 0-4-4l-.6.6M9.2 6.8a2.8 2.8 0 0 0-4 0l-2 2a2.8 2.8 0 0 0 4 4l.6-.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span>anyone with the link</span><input type="radio" name="visibility" value="unlisted" />
            </label>
            <label class="access-row">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span>anyone, and it's in the gallery</span><input type="radio" name="visibility" value="public" />
            </label>
          </fieldset>
          <div class="link-row">
            <input type="text" id="share-link" readonly aria-label="share link" />
            <button type="button" id="share-copy" class="sheet-btn">copy link</button>
          </div>
        </div>
      </div>
    </dialog>

    <dialog id="confirm-dialog" class="sheet sheet--small" aria-labelledby="confirm-title">
      <form class="sheet-inner" method="dialog">
        <header class="sheet-head">
          <h2 id="confirm-title"></h2>
        </header>
        <p class="sheet-body sheet-copy" id="confirm-body"></p>
        <footer class="sheet-foot">
          <button type="button" class="sheet-btn" data-close>cancel</button>
          <button type="submit" class="sheet-btn" id="confirm-ok" value="ok"></button>
        </footer>
      </form>
    </dialog>

    <dialog id="browse-dialog" class="sheet sheet--wide" aria-labelledby="browse-title">
      <div class="sheet-inner">
        <header class="sheet-head">
          <h2 id="browse-title">projects</h2>
          <button type="button" class="sheet-x" data-close aria-label="close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        </header>
        <div id="browse-tabs" role="tablist">
          <button type="button" role="tab" data-tab="mine" class="active">yours</button>
          <button type="button" role="tab" data-tab="gallery">gallery</button>
        </div>
        <div id="browse-grid"></div>
        <footer class="sheet-foot" id="browse-foot" hidden>
          <button type="button" class="sheet-btn" id="browse-more">more</button>
        </footer>
      </div>
    </dialog>

    <!-- Menus (native popover: light dismiss, Esc, one open at a time). -->
    <div id="account-menu" class="menu" popover role="menu">
      <div class="menu-label" id="account-email"></div>
      <button type="button" role="menuitem" id="account-signout" class="menu-danger">sign out</button>
    </div>
    <div id="card-menu" class="menu" popover role="menu">
      <button type="button" role="menuitem" data-act="open">open</button>
      <button type="button" role="menuitem" data-act="copy">copy link</button>
      <hr />
      <button type="button" role="menuitem" data-act="delete" class="menu-danger">delete</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
